name: Build signed iOS distribution archive
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Install Apple distribution identity
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          test -n "$CERTIFICATE" && test -n "$PROFILE" && test -n "$TEAM" || { echo 'Apple distribution certificate, profile and team are required'; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/zenix-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          test "$PROFILE_TEAM" = "$TEAM" || { echo 'Provisioning team does not match'; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          printf 'ZENIX_PROFILE_NAME=%s\nZENIX_APPLE_TEAM=%s\n' "$NAME" "$TEAM" >> "$GITHUB_ENV"
      - name: Archive and export for App Store Connect
        run: |
          mkdir -p release
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath release/Zenix.xcarchive DEVELOPMENT_TEAM="$ZENIX_APPLE_TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$ZENIX_PROFILE_NAME" archive
          python3 - <<'PY'
          import os, plistlib
          with open('release/ExportOptions.plist', 'wb') as file:
              plistlib.dump({'method': 'app-store-connect', 'teamID': os.environ['ZENIX_APPLE_TEAM'], 'signingStyle': 'manual', 'signingCertificate': 'Apple Distribution', 'manageAppVersionAndBuildNumber': False, 'provisioningProfiles': {'com.zenix.musicplayer': os.environ['ZENIX_PROFILE_NAME']}}, file)
          PY
          xcodebuild -exportArchive -archivePath release/Zenix.xcarchive -exportOptionsPlist release/ExportOptions.plist -exportPath release/ios-distribution
      - uses: actions/upload-artifact@v4
        with:
          name: Zenix-iOS-AppStoreConnect
          path: release/ios-distribution/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing identity
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/zenix-signing.keychain-db" || true
