name: Verify staged Windows installer
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Existing maintenance revision to verify
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Verify the actual uploaded installer without executing it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: node scripts/Verify-StagedWindows.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: staged-windows-identity
          path: release/staged-windows-identity.json
          if-no-files-found: error
          retention-days: 7
