<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>解锁桌面歌词</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; background:transparent; }
    body { display:grid; place-items:center; }
    button {
      display:grid; place-items:center; width:37px; height:37px; padding:0; cursor:pointer;
      border:1px solid rgba(255,255,255,.27); border-radius:50%;
      background:rgba(27,33,42,.72); color:rgba(255,255,255,.89);
      box-shadow:0 4px 12px rgba(0,0,0,.22); backdrop-filter:blur(15px);
    }
    button:hover,button:focus-visible { outline:none; border-color:rgba(255,255,255,.62); background:rgba(38,45,55,.88); }
    svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  </style>
</head>
<body>
  <button id="unlock" aria-label="解锁桌面歌词" title="解锁桌面歌词">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
  </button>
  <script>document.getElementById('unlock').addEventListener('click', () => window.desktopLyrics?.unlock());</script>
</body>
</html>
