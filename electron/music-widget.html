<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>Zenix 音乐卡</title><style>
*{box-sizing:border-box}body{margin:0;padding:8px;color:#edf3ff;font:14px 'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden}.card{height:calc(100vh - 16px);padding:18px 22px;border-radius:24px;border:1px solid #ffffff50;background:radial-gradient(ellipse at 20% 0,#435774aa,transparent 70%),linear-gradient(140deg,#293346f5,#141923f5);box-shadow:0 7px 20px #0005;display:flex;flex-direction:column;-webkit-app-region:drag}.top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:#b4c4dc}button{-webkit-app-region:no-drag;color:inherit;cursor:pointer;background:#ffffff16;border:1px solid #ffffff30;border-radius:100px;padding:8px 13px}.top button{border:0;background:none;padding:0 4px}.art{flex:1;display:grid;place-items:center;min-height:0}.disc{width:80px;height:80px;border:14px double #8aa5ca70;border-radius:50%;background:radial-gradient(circle,#dce6f6 5%,#1c2535 6%,#728eb9 9%,#182334 11%);box-shadow:0 0 30px #92baff30}.title{font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:11px;color:#b5bfd0;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;justify-content:center;gap:16px;margin-top:13px}.controls button:nth-child(2){background:#e1eafc;color:#1a2434}@media(max-height:220px){.art{display:none}.title{margin-top:12px}.controls{margin-top:10px}}@media(max-height:150px){.card{padding:12px 20px}.title{font-size:14px;max-width:52%;margin-top:7px}.artist{max-width:52%}.controls{position:absolute;right:26px;bottom:24px;gap:5px}.controls button{padding:8px 10px}}
</style></head><body><div class="card"><div class="top"><span>ZENIX / MUSIC</span><div><button data-action="open" aria-label="打开 Zenix">↗</button><button data-action="close" aria-label="关闭组件">×</button></div></div><div class="art"><div class="disc"></div></div><div class="title">还没有播放歌曲</div><div class="artist">你的音乐，自成宇宙。</div><div class="controls"><button data-action="previous" aria-label="上一首">Ⅰ◀</button><button data-action="play-pause" aria-label="播放或暂停">▶</button><button data-action="next" aria-label="下一首">▶Ⅰ</button></div></div><script src="music-widget.cjs"></script></body></html>
