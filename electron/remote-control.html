<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zenix 遥控器</title><style>body{color:#edf4ff;background:radial-gradient(at 10% 0,#334960,#111725 70%);font:16px system-ui;margin:0;min-height:100vh;padding:28px;box-sizing:border-box}main{max-width:480px;margin:8vh auto;padding:25px;border:1px solid #ffffff30;background:#ffffff0a;border-radius:28px}button,input{font:inherit;color:inherit;background:#ffffff12;border:1px solid #ffffff30;border-radius:14px;padding:14px;max-width:100%;box-sizing:border-box}button{cursor:pointer}h1{font-size:26px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.row button{flex:1}small,p{color:#adbed4}input[type=range]{width:100%}#error{color:#ffc6c6;min-height:24px}</style><main><small>ZENIX · REMOTE</small><h1>连接电脑播放器</h1><form id="pair"><p>输入电脑显示的配对码，再在电脑确认连接。</p><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="六位配对码" required aria-label="配对码"><button>配对</button></form><section id="control" hidden><h2 id="title"></h2><p id="artist"></p><p id="state"></p><div class="row"><button data-command="previous">上一首</button><button data-command="play-pause" id="toggle">播放</button><button data-command="next">下一首</button></div><label>播放进度<input id="seek" type="range" min="0" max="1" step="1"></label><p id="time"></p><label>电脑音量<input id="volume" type="range" min="0" max="1" step=".05"></label><div class="row"><button id="disconnect">断开连接</button></div></section><p id="error" role="status"></p><small>声音由电脑播放。关闭电脑端接收可撤销本次所有连接。</small></main><script nonce="__NONCE__">let token='',timer,busy=false;const $=id=>document.getElementById(id);async function api(action,data={}){const response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...data})});if(!response.ok)throw Error('连接未授权、已过期或网络中断，请重新配对');return response.json();}async function poll(){if(busy||document.hidden)return;busy=true;try{if(!$('pair').hidden){const s=await api('pairStatus');if(!s.approved){$('error').textContent='等待电脑确认连接…';return;}$('pair').hidden=true;$('control').hidden=false;}const s=await api('status');$('title').textContent=s.title;$('artist').textContent=s.artist;$('state').textContent=s.playing?'正在播放':'已暂停或正在加载';$('toggle').textContent=s.playing?'暂停':'播放';$('seek').max=s.duration||1;if(document.activeElement!==$('seek'))$('seek').value=s.position;if(document.activeElement!==$('volume'))$('volume').value=s.volume;$('time').textContent=Math.floor(s.position)+' / '+Math.floor(s.duration)+' 秒';$('error').textContent='';}catch(e){$('error').textContent=e.message;}finally{busy=false;}}$('pair').onsubmit=async e=>{e.preventDefault();try{const s=await api('pair',{code:$('code').value,label:'手机浏览器'});token=s.token;clearInterval(timer);timer=setInterval(poll,1000);poll();}catch(e){$('error').textContent=e.message;}};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>api(b.dataset.command).catch(e=>$('error').textContent=e.message));$('seek').onchange=()=>api('seek',{seconds:+$('seek').value}).catch(e=>$('error').textContent=e.message);$('volume').onchange=()=>api('volume',{volume:+$('volume').value}).catch(e=>$('error').textContent=e.message);$('disconnect').onclick=async()=>{clearInterval(timer);try{await api('disconnect');}catch{}token='';$('control').hidden=true;$('pair').hidden=false;$('error').textContent='已断开';};</script></html>
