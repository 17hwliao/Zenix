<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self';">
<style>
html,body{margin:0;background:transparent;overflow:hidden;color:#e8edf6;font-family:system-ui}#grip{height:20px;-webkit-app-region:drag;cursor:move;text-align:center;color:#71809b}#character{height:calc(100vh - 58px);width:100%;display:grid;place-items:center}#character img,#character svg{width:100%;height:100%;object-fit:contain}nav{height:34px;display:flex;gap:4px;justify-content:center}button{border:0;border-radius:10px;background:#1b2334d9;color:#fff;font-size:16px;min-width:32px;cursor:pointer}#message{position:fixed;bottom:35px;background:#182033dd;border-radius:9px;font-size:11px}
.pet-eyes{transform-origin:90px 100px}.pet-body{transform-origin:90px 100px}.pet-notes{opacity:0;transform-origin:90px 100px}body[data-state=idle] .pet-eyes{animation:pet-blink 6s infinite}body[data-state=listening] .pet-body{animation:pet-listen 1.3s ease-in-out infinite}body[data-state=thinking] .pet-eyes{animation:pet-think 1.5s ease-in-out infinite}body[data-state=executing] .pet-body{animation:pet-work .9s ease-in-out infinite}body[data-state=success] .pet-body{animation:pet-success .65s ease-in-out 2}body[data-state=failure] .pet-body{animation:pet-failure .5s ease-in-out 2}body[data-musical=true] #character>svg,body[data-musical=true] #character>img{animation:pet-music 1.8s ease-in-out infinite}body[data-musical=true] .pet-notes{opacity:1}body[data-animated=false] *{animation:none!important}body[data-light=true] .pet-eyes{animation:none}
@keyframes pet-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}@keyframes pet-listen{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes pet-think{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}@keyframes pet-work{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(.97,1.03)}}@keyframes pet-success{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px) rotate(4deg)}}@keyframes pet-failure{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pet-music{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}@media(prefers-reduced-motion:reduce){body *{animation:none!important}}
</style>
<template id="default-template"><svg viewBox="0 0 180 180" role="img" aria-label="Zenix 原创音乐精灵"><g class="pet-body"><path d="M42 64 32 24 72 45M108 45 148 24 138 65" fill="#bacce8" stroke="#263349" stroke-width="5"/><ellipse cx="90" cy="98" rx="65" ry="62" fill="#d8e5fa" stroke="#263349" stroke-width="5"/><path d="M35 92Q90 33 145 92" fill="#a6badb"/><g class="pet-eyes"><ellipse cx="66" cy="100" rx="7" ry="10" fill="#263349"/><ellipse cx="114" cy="100" rx="7" ry="10" fill="#263349"/></g><path d="M79 119Q90 132 102 119" fill="none" stroke="#263349" stroke-width="5" stroke-linecap="round"/><circle cx="45" cy="115" r="9" fill="#e8adba"/><circle cx="135" cy="115" r="9" fill="#e8adba"/><path d="M26 80Q14 122 35 135M154 80Q166 122 145 135" fill="none" stroke="#597798" stroke-width="11" stroke-linecap="round"/></g><g class="pet-notes" fill="none" stroke="#6b93b4" stroke-width="4"><path d="M12 38V17L25 14V34"/><ellipse cx="8" cy="39" rx="4" ry="3"/><ellipse cx="21" cy="35" rx="4" ry="3"/></g></svg></template>
<div id="grip" title="拖动桌宠">···</div><div id="character"></div>
<nav><button data-action="previous" aria-label="上一首">‹</button><button data-action="play-pause" aria-label="播放或暂停">Ⅱ</button><button data-action="next" aria-label="下一首">›</button><button data-action="show" aria-label="打开音乐助手">↗</button><button id="close" aria-label="关闭桌宠">×</button></nav><span id="message" role="status"></span><script src="assistant-pet.cjs"></script></html>
