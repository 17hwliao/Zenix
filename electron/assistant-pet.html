<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'; media-src blob:;">
<style>
html,body{margin:0;background:transparent;overflow:hidden;color:#e8edf6;font-family:system-ui;user-select:none;-webkit-app-region:no-drag}#grip{height:20px;cursor:grab;text-align:center;font-size:11px;color:#d9e6f4;opacity:0;transition:opacity .15s}#character{height:calc(100vh - 58px);width:100%;display:grid;place-items:center;cursor:grab;touch-action:none;outline-offset:-4px}#character>img{width:100%;height:100%;object-fit:contain;pointer-events:none}#character:focus-visible{outline:2px solid #a9dafa;border-radius:18px}body[data-locked=true] #character,body[data-locked=true] #grip{cursor:pointer}body[data-dragging=true] #character,body[data-dragging=true] #grip{cursor:grabbing}
.pet-portrait{position:relative;display:block;width:100%;height:100%;transform-origin:50% 70%;pointer-events:none}.pet-portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}.pet-blink{opacity:0;animation:pet-blink 6s steps(1,end) infinite}
nav{height:34px;display:flex;gap:4px;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .15s}body:hover nav,body:focus-within nav{opacity:1;pointer-events:auto}body:hover #grip,body:focus-within #grip{opacity:1}button{border:1px solid #ffffff28;border-radius:12px;background:#141d2bd9;color:#fff;font-size:16px;min-width:28px;height:30px;cursor:pointer}button:focus-visible{outline:2px solid #a9dafa}#message{position:fixed;left:8px;right:8px;bottom:36px;background:#182033e8;border-radius:9px;font-size:11px;text-align:center;overflow-wrap:anywhere}#message:empty{display:none}
body[data-state=idle] .pet-body{animation:pet-breathe 4.5s ease-in-out infinite}body[data-state=listening] .pet-body{animation:pet-listen 1.3s ease-in-out infinite}body[data-state=thinking] .pet-body{animation:pet-listen 2.6s ease-in-out infinite}body[data-state=executing] .pet-body{animation:pet-work .9s ease-in-out infinite}body[data-state=success] .pet-body{animation:pet-success .65s ease-in-out 2}body[data-state=failure] .pet-body{animation:pet-failure .5s ease-in-out 2}body[data-musical=true] #character{animation:pet-music 1.8s ease-in-out infinite}body[data-animated=false] *,body[data-dragging=true] #character{animation:none!important}body[data-light=true] .pet-blink{animation:none}
@keyframes pet-blink{0%,94%,98%,100%{opacity:0}95%,97%{opacity:1}}@keyframes pet-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.008)}}@keyframes pet-listen{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}@keyframes pet-work{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes pet-success{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px) rotate(2deg)}}@keyframes pet-failure{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes pet-music{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg) translateY(-2px)}}@media(prefers-reduced-motion:reduce){body *{animation:none!important;transition:none!important}}
.pet-shy,.pet-listening{opacity:0}body[data-state=shy] .pet-portrait img,body[data-state=listening] .pet-portrait img,body[data-state=talking] .pet-portrait img,body[data-state=thinking] .pet-portrait img{opacity:0;animation:none}body[data-state=shy] .pet-portrait .pet-shy,body[data-state=listening] .pet-portrait .pet-listening,body[data-state=talking] .pet-portrait .pet-listening,body[data-state=thinking] .pet-portrait .pet-listening{opacity:1}body[data-state=shy] .pet-body{animation:pet-shy .55s ease-out 1}body[data-state=listening] .pet-body,body[data-state=thinking] .pet-body,body[data-state=talking] .pet-body{animation:none}#voice{touch-action:none}body[data-voice=true] nav{opacity:1;pointer-events:auto}body[data-state=listening] #message{border:1px solid #b5edff}nav{gap:3px}nav button{min-width:26px;padding:0 5px}@keyframes pet-shy{0%{transform:scale(.94)}70%{transform:scale(1.025)}100%{transform:scale(1)}}
.pet-portrait .pet-talking-mouth{opacity:0;clip-path:ellipse(5% 2.5% at 51% 28.8%)}body[data-state=talking] .pet-portrait .pet-talking-mouth{animation:pet-talk .32s steps(1,end) infinite}@keyframes pet-talk{0%,100%{opacity:0}50%{opacity:1}}@media(prefers-reduced-motion:reduce){body[data-state=talking] .pet-portrait .pet-talking-mouth{animation:none!important}}
.pet-brand{position:absolute;left:50%;bottom:53px;transform:translateX(-50%);font:700 10px system-ui;color:white;background:#182637aa;padding:2px 7px;border-radius:8px;pointer-events:none}body[data-state=greeting] .pet-body{animation:pet-greet .6s ease-out 1}body[data-state=cheer] .pet-body{animation:pet-cheer .6s ease-out 1}@keyframes pet-greet{30%{transform:rotate(-4deg)}70%{transform:rotate(3deg)}}@keyframes pet-cheer{35%{transform:translateY(-8px)}70%{transform:translateY(-2px)}}@media(prefers-reduced-motion:reduce){.pet-body{animation:none!important}}</style>
<template id="default-template"><span class="pet-body pet-portrait"><img src="../assets/assistant/zenix-muse.png" alt="Zenix 星音看板娘" draggable="false"><img class="pet-blink" src="../assets/assistant/zenix-muse-blink.png" alt="" aria-hidden="true" draggable="false"><img class="pet-shy" src="../assets/assistant/zenix-muse-shy.png" alt="" aria-hidden="true" draggable="false"><img class="pet-listening" src="../assets/assistant/zenix-muse-listening.png" alt="" aria-hidden="true" draggable="false"><img class="pet-talking-mouth" src="../assets/assistant/zenix-muse-speaking-closed.png" alt="" aria-hidden="true" draggable="false"></span></template>
<div id="grip" title="也可以直接拖动角色">拖动角色移动</div><div id="character" role="button" tabindex="0" title="拖动移动，轻触害羞回应；按住空格说话"></div>
<nav aria-label="桌宠快捷操作"><button data-action="previous" aria-label="上一首">‹</button><button data-action="play-pause" aria-label="播放或暂停">Ⅱ</button><button data-action="next" aria-label="下一首">›</button><button data-action="show" aria-label="打开音乐助手">↗</button><button id="voice" aria-label="按住说话">♩</button><button id="close" aria-label="关闭桌宠">×</button></nav><span class="pet-brand" aria-hidden="true">Zenix</span><span id="message" role="status"></span><script src="../src/features/assistant/hold-recording.cjs"></script><script src="assistant-pet.cjs"></script></html>
