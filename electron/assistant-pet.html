<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src blob:;">
<style>
html,body{margin:0;background:transparent;overflow:hidden;color:#eee;font:12px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;user-select:none;-webkit-app-region:no-drag}
*{box-sizing:border-box}button{font:inherit;cursor:pointer}button:focus-visible,#character:focus-visible,#grip:focus-visible{outline:2px solid #c4c9b5;outline-offset:-2px}
#character{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;border-radius:20px;filter:drop-shadow(0 3px 3px #0002);transition:filter .2s}
#character canvas{pointer-events:none}
body[data-locked=true] #character,body[data-locked=true] #grip{cursor:pointer}
body[data-dragging=true] #character,body[data-dragging=true] #grip{cursor:grabbing}
body[data-dragging=true] #character{filter:drop-shadow(0 12px 8px #0004) drop-shadow(0 0 2px #f5f7e84d)}
#pet-ground{position:absolute;bottom:7px;left:31%;right:31%;height:5px;background:#0003;border-radius:50%;filter:blur(3px);pointer-events:none;transition:opacity .18s,transform .18s}
body:is([data-dragging=true],[data-movement=falling]) #pet-ground{opacity:0;transform:scale(.7)}
nav{position:absolute;top:5px;left:50%;transform:translate(-50%,-5px);z-index:3;display:flex;gap:2px;align-items:center;padding:3px;border:1px solid #ffffff35;border-radius:25px;background:#242720ed;box-shadow:0 3px 12px #0002;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
body:is(:hover,:focus-within,[data-voice=true]) nav{opacity:1;transform:translate(-50%,0);pointer-events:auto}
nav button{display:grid;place-items:center;width:27px;height:27px;padding:0;border:0;border-radius:50%;color:#e9ecdf;background:transparent}
nav button:hover{background:#ffffff1b}svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#grip{position:absolute;bottom:0;left:35%;right:35%;height:14px;z-index:2;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:grab;touch-action:none;color:#fff;background:#242720b8;opacity:0;transition:opacity .18s}
#grip:after{content:"";width:17px;height:3px;border-radius:2px;background:currentColor;opacity:.65}
body:is(:hover,:focus-within) #grip{opacity:1}
#message{position:fixed;left:7px;right:7px;bottom:24%;z-index:4;padding:8px 10px;border:1px solid #d3d8c5;border-radius:12px;background:#f5f6eef5;color:#373c2f;font-size:11px;line-height:1.65;text-align:center;overflow-wrap:anywhere;max-height:42%;overflow:hidden;pointer-events:none;box-shadow:0 4px 12px #0001;animation:pet-note-in .2s ease-out}
#message:empty{display:none}
#scale-chip{position:absolute;right:8px;top:43px;z-index:4;padding:3px 7px;border-radius:15px;color:#e5ead9;background:#242720e8;font:10px/1.5 ui-monospace,monospace;pointer-events:none;opacity:0;transform:translateY(-3px);transition:opacity .16s,transform .16s}
body[data-resized=true] #scale-chip{opacity:1;transform:none}
#pet-menu{position:absolute;inset:8px 6px auto;z-index:6;max-height:calc(100vh - 16px);overflow:auto;scrollbar-width:thin;padding:7px;border:1px solid #d7d8cf;border-radius:14px;background:#f6f7f0f8;color:#33382d;box-shadow:0 4px 15px #0002;animation:pet-note-in .16s ease-out}
#pet-menu[hidden]{display:none}
#pet-menu>strong{display:block;color:#8b9280;font-size:9px;font-weight:500;padding:2px 5px 6px;letter-spacing:.08em}
#pet-menu button{display:flex;align-items:center;justify-content:flex-start;gap:7px;width:100%;min-height:29px;padding:5px 7px;font-size:11px;background:transparent;color:inherit;border:0;border-radius:7px;text-align:left}
#pet-menu button:hover{background:#e6eadb}#pet-menu hr{border:0;border-top:1px solid #dce0d2;margin:5px 2px}
#pet-menu .pet-menu-playback{display:flex;gap:3px}#pet-menu .pet-menu-playback button{justify-content:center;font-size:16px}
#voice{touch-action:none}body[data-state=listening] #voice{background:#d5dfbf;color:#353e2b}
@keyframes pet-note-in{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
body[data-animated=false] *{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){body *{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="../dist/ui/native-style.css"><script type="module" src="../dist/ui/native-appearance.js"></script>
<div id="pet-ground" aria-hidden="true"></div>
<div id="character" role="button" tabindex="0" title="轻触互动 · 拖动拎起 · 双击聊天 · 滚轮缩放"></div>
<div id="grip" title="拖动人物" aria-label="拖动人物"></div>
<nav aria-label="桌宠快捷操作">
  <button data-action="chat" aria-label="打开袖珍聊天" title="聊天 · 双击人物"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-3 3V11.5A7.5 7.5 0 0 1 9.5 4h3a7.5 7.5 0 0 1 7.5 7.5Z"/><path d="M7 10h8M7 14h5"/></svg></button>
  <button id="voice" aria-label="按住说话" title="按住说话"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button>
  <button id="pet-menu-toggle" aria-label="人物互动与设置" aria-expanded="false" title="更多互动 · 右键人物"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
</nav>
<div id="pet-menu" hidden><strong>和我互动</strong><button data-pet-motion="jump">↟　跳一下</button><button data-pet-motion="wave">✧　招招手</button><button data-pet-motion="sit">⌁　坐一会儿</button><button data-pet-motion="sleep">☾　休息一下</button><button data-pet-motion="stand">↑　站起来</button><hr>
<div class="pet-menu-playback"><button data-action="previous" aria-label="上一首">‹</button><button data-action="play-pause" aria-label="播放或暂停">Ⅱ</button><button data-action="next" aria-label="下一首">›</button></div>
<button data-action="show">↗　打开 Zenix</button><button id="close" aria-label="关闭桌宠">×　收起人物</button></div>
<span id="scale-chip" role="status"></span><span id="message" role="status"></span>
<script src="../src/features/assistant/hold-recording.cjs"></script><script src="../dist/assistant/zenbot/renderer.js"></script><script src="assistant-pet.cjs"></script></html>
