<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenix 桌面歌词</title>
  <style>
    :root {
      --lyric-color:#b7e7ff;
      --lyric-size:28px;
      --lyric-weight:750;
      --lyric-family:Inter,"Microsoft YaHei",sans-serif;
      --glass-opacity:.56;
    }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; color:#f7f9fc; font-family:Inter,"Microsoft YaHei",sans-serif; user-select:none; }
    body { padding:8px; }
    button,select,input { font:inherit; }
    .glass {
      position:relative; width:100%; height:100%; min-height:174px; overflow:hidden; border:1px solid transparent; border-radius:30px;
      background:transparent; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none;
      -webkit-app-region:no-drag;
    }
    body:not(.is-locked) .glass:hover,body.is-editor-open .glass {
      border-color:rgba(255,255,255,.2);
      background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(30,36,44,var(--glass-opacity)) 30%,rgba(13,17,23,var(--glass-opacity)));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 7px 22px rgba(0,0,0,.13);
      backdrop-filter:blur(25px) saturate(108%); -webkit-backdrop-filter:blur(25px) saturate(108%);
    }
    .glass::before,.glass::after { display:none; }
    .top { position:relative; z-index:1; display:flex; align-items:center; gap:10px; height:39px; padding:8px 19px 0; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .18s; -webkit-app-region:drag; }
    .bottom { opacity:0; visibility:hidden; transition:opacity .18s; }
    body:not(.is-locked) .glass:hover .top,body:not(.is-locked) .glass:hover .bottom,body.is-editor-open .top,body.is-editor-open .bottom { opacity:1; visibility:visible; pointer-events:auto; }
    .drag-handle { display:flex; flex:1; align-items:center; gap:10px; min-width:0; height:100%; cursor:move; -webkit-app-region:drag; }
    .drag-grip { flex:none; display:grid; grid-template-columns:repeat(3,2px); gap:3px; opacity:.46; }
    .drag-grip i { width:2px; height:2px; border-radius:50%; background:currentColor; }
    .mark { flex:none; width:25px; height:25px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.17); border-radius:50%; background:rgba(255,255,255,.09); color:rgba(255,255,255,.76); font-size:12px; font-weight:750; }
    .song { flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:rgba(255,255,255,.74); font-size:10px; font-weight:700; letter-spacing:.13em; }
    .controls { display:flex; align-items:center; gap:5px; opacity:.62; transition:opacity .18s; -webkit-app-region:no-drag; }
    .glass:hover .controls,.glass:focus-within .controls { opacity:1; }
    .icon-button { flex:none; display:grid; place-items:center; width:28px; height:28px; padding:0; border:1px solid rgba(255,255,255,.16); border-radius:50%; background:rgba(255,255,255,.09); color:#f8fbff; cursor:pointer; -webkit-app-region:no-drag; transition:background .18s,border-color .18s,transform .18s; }
    .icon-button:hover,.icon-button:focus-visible { outline:none; border-color:rgba(255,255,255,.37); background:rgba(255,255,255,.17); }
    .icon-button.play { width:30px; height:30px; background:rgba(255,255,255,.16); color:#f8fbff; }
    .icon-button.appearance { width:37px; border-radius:14px; color:var(--lyric-color); font-size:11px; font-weight:800; }
    .icon-button.lock svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .icon-button.close { font-size:19px; line-height:1; }
    .lines { position:relative; z-index:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px; height:calc(100% - 76px); min-height:105px; padding:0 30px; text-align:center; touch-action:none; cursor:grab; --drag-offset:0px; }
    .lines:active { cursor:grabbing; }
    .lines.is-browsing { padding-left:100px; padding-right:100px; }
    .lines.is-browsing::before { content:'歌词预览 · 3 秒后自动同步'; position:absolute; z-index:2; top:1px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.48); font-size:9px; white-space:nowrap; pointer-events:none; }
    .lines.is-browsing::after { content:''; position:absolute; z-index:0; top:50%; left:50%; width:min(70%,540px); height:66px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(ellipse,rgba(255,255,255,.045),transparent 72%); pointer-events:none; animation:preview-glow .34s ease-out both; }
    .line { display:block; width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-family:var(--lyric-family); font-weight:var(--lyric-weight); }
    .lines .line { position:relative; z-index:1; translate:0 var(--drag-offset); transition:translate .13s cubic-bezier(.2,.8,.2,1); pointer-events:none; }
    .line.previous,.line.next { color:rgba(244,248,255,.54); font-size:calc(var(--lyric-size) * .57); line-height:1.27; text-shadow:0 1px 8px rgba(0,0,0,.45); }
    .line.current { color:var(--lyric-color); font-size:var(--lyric-size); line-height:1.3; text-shadow:0 1px 5px rgba(0,0,0,.65); letter-spacing:.02em; }
    body.is-paused .line.current { opacity:.67; text-shadow:0 1px 9px rgba(0,0,0,.7); }
    body.is-paused .lines.is-browsing .line.current { opacity:1; }
    .lines.is-browsing .line.current { text-shadow:0 1px 6px rgba(0,0,0,.7),0 0 19px color-mix(in srgb,var(--lyric-color) 26%,transparent); }
    .line.is-placeholder { opacity:.38; }
    .jump { position:absolute; z-index:2; right:14px; top:50%; display:none; align-items:center; justify-content:center; gap:5px; min-width:65px; height:32px; padding:0 9px; transform:translateY(-50%); border:1px solid rgba(255,255,255,.26); border-radius:18px; background:rgba(255,255,255,.12); color:var(--lyric-color); font-size:11px; font-weight:700; cursor:pointer; backdrop-filter:blur(10px); }
    .jump:hover,.jump:focus-visible { outline:none; border-color:var(--lyric-color); background:rgba(255,255,255,.2); }
    .lines.is-browsing .jump { display:flex; animation:preview-jump .28s cubic-bezier(.16,1,.3,1) both; }
    @keyframes preview-glow { from { opacity:0; scale:.78; } to { opacity:1; scale:1; } }
    @keyframes preview-jump { from { opacity:0; translate:10px 0; scale:.82; } to { opacity:1; translate:0 0; scale:1; } }
    .bottom { position:absolute; z-index:1; left:26px; right:26px; bottom:12px; display:flex; align-items:center; gap:9px; height:19px; -webkit-app-region:no-drag; }
    .bottom time { flex:none; min-width:32px; color:rgba(255,255,255,.66); font:10px Consolas,monospace; text-align:center; }
    .song-progress { flex:1; min-width:0; height:18px; margin:0; padding:0; appearance:none; -webkit-appearance:none; border:0; background:transparent; cursor:pointer; --seek-progress:0%; -webkit-app-region:no-drag; }
    .song-progress::-webkit-slider-runnable-track { height:4px; border-radius:10px; background:linear-gradient(to right,var(--lyric-color) 0 var(--seek-progress),rgba(255,255,255,.24) var(--seek-progress) 100%); }
    .song-progress::-webkit-slider-thumb { width:11px; height:11px; margin-top:-3.5px; appearance:none; -webkit-appearance:none; border:2px solid #fff; border-radius:50%; background:var(--lyric-color); box-shadow:0 0 6px rgba(0,0,0,.35); }
    .song-progress:focus-visible { outline:1px solid var(--lyric-color); outline-offset:2px; }
    .song-progress:disabled { opacity:.35; cursor:default; }
    .editor { position:absolute; z-index:5; inset:5px; display:none; flex-direction:column; padding:12px 17px; border:1px solid rgba(255,255,255,.28); border-radius:30px; background:linear-gradient(150deg,rgba(59,71,85,.95),rgba(13,18,28,.97)); box-shadow:0 9px 25px rgba(0,0,0,.3); -webkit-app-region:no-drag; }
    .editor.is-open { display:flex; }
    .editor-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .editor-head strong { font-size:12px; letter-spacing:.08em; }.editor-head small { margin-left:10px; color:rgba(255,255,255,.45); font-size:10px; }
    .editor-close { display:grid; place-items:center; width:23px; height:23px; border:1px solid rgba(255,255,255,.25); border-radius:50%; background:rgba(255,255,255,.12); color:#fff; cursor:pointer; }
    .editor-grid { display:grid; grid-template-columns:1.4fr .7fr 1fr 1fr; gap:10px; }
    .editor label { display:flex; flex-direction:column; gap:4px; min-width:0; color:rgba(255,255,255,.69); font-size:10px; }
    .editor select,.editor input[type=range] { width:100%; }
    .editor select { height:27px; padding:3px 7px; border:1px solid rgba(255,255,255,.22); border-radius:8px; outline:none; background:#303b4b; color:#fff; font-size:11px; cursor:pointer; }
    .editor input[type=range] { height:27px; margin:0; accent-color:var(--lyric-color); cursor:pointer; }
    .editor-value { color:#fff; font:10px Consolas,monospace; }
    .editor-colors { display:flex; align-items:center; gap:9px; margin-top:10px; }
    .editor-colors > span { margin-right:2px; color:rgba(255,255,255,.69); font-size:10px; }
    .editor-colors input[type=color] { width:30px; height:25px; padding:2px; border:1px solid rgba(255,255,255,.28); border-radius:8px; background:rgba(255,255,255,.1); cursor:pointer; }
    .swatch { width:22px; height:22px; padding:0; border:1px solid rgba(255,255,255,.55); border-radius:50%; background:var(--swatch); cursor:pointer; }
    .swatch:hover { outline:2px solid #fff; outline-offset:2px; }
    .editor-hint { margin-left:auto; color:rgba(255,255,255,.36); font-size:9px; }
    .editor-preview { position:relative; display:flex; flex:1; align-items:center; justify-content:center; min-height:30px; margin-top:10px; overflow:hidden; border-top:1px solid rgba(255,255,255,.13); }
    .editor-preview small { position:absolute; top:5px; left:0; color:rgba(255,255,255,.37); font-size:9px; }
    .editor-preview strong { max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--lyric-color); font-family:var(--lyric-family); font-size:var(--lyric-size); font-weight:var(--lyric-weight); text-shadow:0 1px 5px rgba(0,0,0,.6); }
    @media (max-width:680px) { .editor-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 10px; }.editor { padding:9px 14px; }.editor-colors { margin-top:6px; }.editor-hint { display:none; } }
    @media (prefers-reduced-motion:reduce) { .icon-button,.lines .line { transition:none; }.lines.is-browsing::after,.lines.is-browsing .jump { animation:none; } }
  </style>
</head>
<body class="is-paused">
  <div class="glass">
    <div class="top">
      <div class="drag-handle" title="拖动歌词窗口"><span class="drag-grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><div class="mark" aria-hidden="true">Z</div><div class="song" id="song">ZENIX · 桌面歌词</div></div>
      <div class="controls">
        <button class="icon-button" id="previous-track" title="上一首" aria-label="上一首">‹</button>
        <button class="icon-button play" id="play" title="播放或暂停" aria-label="播放或暂停">▶</button>
        <button class="icon-button" id="next-track" title="下一首" aria-label="下一首">›</button>
        <button class="icon-button appearance" id="appearance" title="调整歌词外观" aria-label="调整歌词外观" aria-expanded="false">Aa</button>
        <button class="icon-button lock" id="lock" title="锁定歌词，让鼠标点击穿透" aria-label="锁定歌词，让鼠标点击穿透"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/><path d="M12 14v3"/></svg></button>
        <button class="icon-button close" id="close" title="隐藏桌面歌词" aria-label="隐藏桌面歌词">×</button>
      </div>
    </div>
    <div class="lines" id="lines" aria-label="上下拖动预览歌词" aria-live="off">
      <span class="line previous is-placeholder" id="previous">上一句歌词</span>
      <span class="line current" id="current">播放歌曲后显示歌词</span>
      <span class="line next is-placeholder" id="next">下一句歌词</span>
      <button class="jump" id="jump" title="播放预览的这一句" aria-label="跳转到预览歌词">▶ <span id="jump-time">0:00</span></button>
    </div>
    <div class="bottom"><time id="elapsed">0:00</time><input class="song-progress" id="song-progress" type="range" min="0" max="1" step="0.1" value="0" aria-label="歌曲播放进度"><time id="total">0:00</time></div>
    <div class="editor" id="editor" role="dialog" aria-label="桌面歌词外观" aria-hidden="true">
      <div class="editor-head"><div><strong>歌词外观</strong><small>字体 · 字号 · 颜色 · 玻璃透明度</small></div><button class="editor-close" id="editor-close" title="返回歌词" aria-label="返回歌词">×</button></div>
      <div class="editor-grid">
        <label>字体<select id="font"><option value="system">系统默认</option><option value="yahei">微软雅黑</option><option value="heiti">黑体</option><option value="songti">宋体</option><option value="kaiti">楷体</option><option value="mono">等宽字体</option></select></label>
        <label>字重<select id="weight"><option value="500">常规</option><option value="700">加粗</option><option value="850">特粗</option></select></label>
        <label>字号 <span class="editor-value" id="size-value">28 px</span><input id="size" type="range" min="18" max="42" step="1"></label>
        <label>玻璃透明度 <span class="editor-value" id="opacity-value">56%</span><input id="opacity" type="range" min="20" max="85" step="1"></label>
      </div>
      <div class="editor-colors"><span>歌词颜色</span><input id="color" type="color" aria-label="自定义歌词颜色"><button class="swatch" style="--swatch:#b7e7ff" data-color="#b7e7ff" title="冰蓝"></button><button class="swatch" style="--swatch:#ffe0a1" data-color="#ffe0a1" title="暖金"></button><button class="swatch" style="--swatch:#8affd5" data-color="#8affd5" title="薄荷"></button><button class="swatch" style="--swatch:#ffadd4" data-color="#ffadd4" title="玫瑰"></button><button class="swatch" style="--swatch:#ffffff" data-color="#ffffff" title="纯白"></button><span class="editor-hint">设置自动保存在本机</span></div>
      <div class="editor-preview"><small>实时预览</small><strong id="preview-line">播放歌曲后显示歌词</strong></div>
    </div>
  </div>
  <script>
    'use strict';
    const storageKey = 'zenix.lyrics.appearance.v2';
    const fonts = {
      system:'Inter,"Microsoft YaHei",sans-serif',
      yahei:'"Microsoft YaHei","Noto Sans SC",sans-serif',
      heiti:'SimHei,"Microsoft YaHei",sans-serif',
      songti:'SimSun,"Songti SC",serif',
      kaiti:'KaiTi,"Kaiti SC",serif',
      mono:'Consolas,"Courier New",monospace',
    };
    const oldThemes = { blue:'#b7e7ff', amber:'#ffe0a1', mint:'#8affd5', rose:'#ffadd4', white:'#ffffff' };
    const defaults = { font:'system', weight:700, size:28, opacity:56, color:oldThemes[localStorage.getItem('zenix.lyrics.theme')] || '#b7e7ff' };
    let settings = defaults;
    try { settings = { ...defaults, ...JSON.parse(localStorage.getItem(storageKey) || '{}') }; } catch {}
    const byId = id => document.getElementById(id);
    function applySettings() {
      settings.font = fonts[settings.font] ? settings.font : 'system';
      settings.weight = [500,700,850].includes(Number(settings.weight)) ? Number(settings.weight) : 700;
      settings.size = Math.max(18,Math.min(42,Number(settings.size) || 28));
      settings.opacity = Math.max(20,Math.min(85,Number(settings.opacity) || 56));
      settings.color = /^#[0-9a-fA-F]{6}$/.test(settings.color) ? settings.color : defaults.color;
      const root = document.documentElement.style;
      root.setProperty('--lyric-family',fonts[settings.font]);
      root.setProperty('--lyric-weight',settings.weight);
      root.setProperty('--lyric-size',settings.size + 'px');
      root.setProperty('--lyric-color',settings.color);
      root.setProperty('--glass-opacity',(settings.opacity / 100).toFixed(2));
      byId('font').value = settings.font;
      byId('weight').value = String(settings.weight);
      byId('size').value = String(settings.size);
      byId('opacity').value = String(settings.opacity);
      byId('color').value = settings.color;
      byId('size-value').textContent = settings.size + ' px';
      byId('opacity-value').textContent = settings.opacity + '%';
      try { localStorage.setItem(storageKey,JSON.stringify(settings)); } catch {}
    }
    applySettings();
    function change(key,value) { settings = { ...settings,[key]:value }; applySettings(); }
    byId('font').addEventListener('change',event => change('font',event.target.value));
    byId('weight').addEventListener('change',event => change('weight',Number(event.target.value)));
    byId('size').addEventListener('input',event => change('size',Number(event.target.value)));
    byId('opacity').addEventListener('input',event => change('opacity',Number(event.target.value)));
    byId('color').addEventListener('input',event => change('color',event.target.value));
    document.querySelectorAll('.swatch').forEach(button => button.addEventListener('click',() => change('color',button.dataset.color)));
    function setEditor(open) { byId('editor').classList.toggle('is-open',open); byId('editor').setAttribute('aria-hidden',String(!open)); byId('appearance').setAttribute('aria-expanded',String(open)); document.body.classList.toggle('is-editor-open',open); }
    function applyLock(locked) { document.body.classList.toggle('is-locked',Boolean(locked)); if (locked) setEditor(false); }
    window.desktopLyrics?.onLockedChanged(applyLock);
    window.desktopLyrics?.lockState().then(applyLock).catch(() => {});
    byId('lock').addEventListener('click',() => { void window.desktopLyrics?.setLocked(true).then(applyLock); });
    byId('appearance').addEventListener('click',() => setEditor(true));
    byId('editor-close').addEventListener('click',() => setEditor(false));
    document.addEventListener('keydown',event => { if (event.key === 'Escape') setEditor(false); });
    byId('previous-track').addEventListener('click',() => window.desktopLyrics?.command('previous'));
    byId('play').addEventListener('click',() => window.desktopLyrics?.command('play-pause'));
    byId('next-track').addEventListener('click',() => window.desktopLyrics?.command('next'));
    byId('close').addEventListener('click',() => window.desktopLyrics?.hide());
    let latestData = { previous:'', line:'', next:'', title:'', trackId:'', playing:false, position:0, duration:0, lines:[] };
    let previewIndex = null;
    let drag = null;
    let scrubbing = false;
    let previewReturnTimer = null;
    const lineAnimations = new WeakMap();
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp = (value,min,max) => Math.max(min,Math.min(max,value));
    const formatTime = value => { const seconds = Math.max(0,Math.floor(Number(value) || 0)); return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2,'0')}`; };
    const activeLineIndex = () => latestData.lines.reduce((index,line,i) => latestData.position >= line.time ? i : index,-1);
    function cancelPreviewReturn() { if (previewReturnTimer !== null) clearTimeout(previewReturnTimer); previewReturnTimer = null; }
    function schedulePreviewReturn() {
      cancelPreviewReturn();
      if (previewIndex === null) return;
      previewReturnTimer = setTimeout(() => {
        previewReturnTimer = null;
        if (drag) { schedulePreviewReturn(); return; }
        const direction = Math.sign(activeLineIndex() - previewIndex);
        previewIndex = null;
        byId('lines').style.setProperty('--drag-offset','0px');
        renderLines(direction);
      },3000);
    }
    function clearPreview() {
      cancelPreviewReturn();
      const direction = previewIndex === null ? 0 : Math.sign(activeLineIndex() - previewIndex);
      previewIndex = null;
      byId('lines').style.setProperty('--drag-offset','0px');
      renderLines(direction);
    }
    function renderLines(direction = 0) {
      const lines = latestData.lines || [];
      const browsing = previewIndex !== null && lines.length > 0;
      const index = browsing ? clamp(previewIndex,0,lines.length - 1) : -1;
      const previous = browsing ? lines[index - 1]?.text || '' : latestData.previous || '';
      const current = browsing ? lines[index]?.text || '' : latestData.line || latestData.title || '播放歌曲后显示歌词';
      const next = browsing ? lines[index + 1]?.text || '' : latestData.next || '';
      const area = byId('lines');
      const animate = !reducedMotion && (browsing || area.classList.contains('is-browsing'));
      const updateLine = (id,text,order) => {
        const element = byId(id);
        if (element.textContent === text) return;
        element.textContent = text;
        if (!animate) return;
        lineAnimations.get(element)?.cancel();
        const opacity = getComputedStyle(element).opacity;
        lineAnimations.set(element,element.animate([
          { opacity:.24, transform:`translateY(${(direction || 1) * 16}px) scale(.97)`, filter:'blur(3px)' },
          { opacity, transform:'translateY(0) scale(1)', filter:'blur(0)' },
        ],{ duration:browsing ? 290 : 380, delay:order * 24, easing:'cubic-bezier(.16,1,.3,1)' }));
      };
      area.classList.toggle('is-browsing',browsing);
      byId('previous').classList.toggle('is-placeholder',!previous);
      byId('next').classList.toggle('is-placeholder',!next);
      updateLine('previous',previous || '上一句歌词',0);
      updateLine('current',current,1);
      byId('preview-line').textContent = current;
      updateLine('next',next || '下一句歌词',2);
      if (browsing) {
        const time = formatTime(lines[index].time);
        byId('jump-time').textContent = time;
        byId('jump').setAttribute('aria-label',`从 ${time} 播放：${current}`);
      }
    }
    function renderProgress(value = latestData.position) {
      const duration = Math.max(0,Number(latestData.duration) || 0);
      const position = clamp(Number(value) || 0,0,duration);
      const slider = byId('song-progress');
      slider.disabled = !latestData.trackId || duration <= 0;
      slider.max = String(duration || 1);
      slider.value = String(position);
      slider.style.setProperty('--seek-progress',`${duration ? position / duration * 100 : 0}%`);
      byId('elapsed').textContent = formatTime(position);
      byId('total').textContent = formatTime(duration);
    }
    const lyricArea = byId('lines');
    lyricArea.addEventListener('pointerdown',event => {
      if (event.target.closest('button') || !latestData.lines?.length) return;
      cancelPreviewReturn();
      drag = { pointerId:event.pointerId, startY:event.clientY, base:previewIndex ?? Math.max(0,activeLineIndex()), moved:false };
      lyricArea.setPointerCapture(event.pointerId);
    });
    lyricArea.addEventListener('pointermove',event => {
      if (!drag || drag.pointerId !== event.pointerId) return;
      const distance = drag.startY - event.clientY;
      if (Math.abs(distance) < 7 && !drag.moved) return;
      drag.moved = true;
      const steps = Math.round(distance / 25);
      const nextIndex = clamp(drag.base + steps,0,latestData.lines.length - 1);
      lyricArea.style.setProperty('--drag-offset',`${clamp((steps * 25 - distance) * .55,-9,9)}px`);
      if (nextIndex !== previewIndex) {
        const direction = Math.sign(nextIndex - (previewIndex ?? drag.base)) || Math.sign(distance);
        previewIndex = nextIndex;
        renderLines(direction);
      }
    });
    const endLyricDrag = event => {
      if (!drag || drag.pointerId !== event.pointerId) return;
      const moved = drag.moved;
      drag = null;
      lyricArea.style.setProperty('--drag-offset','0px');
      if (!moved && previewIndex !== null) clearPreview();
      else if (moved) schedulePreviewReturn();
      if (lyricArea.hasPointerCapture(event.pointerId)) lyricArea.releasePointerCapture(event.pointerId);
    };
    lyricArea.addEventListener('pointerup',endLyricDrag);
    lyricArea.addEventListener('pointercancel',endLyricDrag);
    lyricArea.addEventListener('wheel',event => {
      if (!latestData.lines?.length) return;
      event.preventDefault();
      if (drag) return;
      const nextIndex = clamp((previewIndex ?? Math.max(0,activeLineIndex())) + (event.deltaY > 0 ? 1 : -1),0,latestData.lines.length - 1);
      if (nextIndex !== previewIndex) { previewIndex = nextIndex; renderLines(Math.sign(event.deltaY)); }
      schedulePreviewReturn();
    },{ passive:false });
    byId('jump').addEventListener('click',event => {
      event.stopPropagation();
      const line = latestData.lines?.[previewIndex];
      if (!line || !latestData.trackId) return;
      window.desktopLyrics?.seek(latestData.trackId,line.time);
      window.desktopLyrics?.command('play');
      clearPreview();
    });
    const slider = byId('song-progress');
    slider.addEventListener('pointerdown',() => { scrubbing = true; });
    slider.addEventListener('input',event => renderProgress(event.target.value));
    slider.addEventListener('change',event => {
      const seconds = Number(event.target.value);
      scrubbing = false;
      if (latestData.trackId && Number.isFinite(seconds)) window.desktopLyrics?.seek(latestData.trackId,seconds);
      clearPreview();
    });
    slider.addEventListener('pointercancel',() => { scrubbing = false; renderProgress(); });
    document.addEventListener('keydown',event => { if (event.key === 'Escape' && previewIndex !== null) clearPreview(); });
    window.desktopLyrics?.onData(data => {
      if (data.trackId !== latestData.trackId) { cancelPreviewReturn(); previewIndex = null; drag = null; scrubbing = false; byId('lines').style.setProperty('--drag-offset','0px'); }
      latestData = data;
      byId('song').textContent = data.title || 'ZENIX · 桌面歌词';
      renderLines();
      if (!scrubbing) renderProgress();
      document.body.classList.toggle('is-paused',!data.playing);
      byId('play').textContent = data.playing ? 'Ⅱ' : '▶';
    });
  </script>
</body>
</html>
