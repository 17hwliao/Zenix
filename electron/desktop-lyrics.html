<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:Inter,"Microsoft Yahei",sans-serif;user-select:none}body{padding:7px;box-sizing:border-box}.pill{height:88px;box-sizing:border-box;position:relative;display:flex;align-items:center;gap:16px;padding:13px 22px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:linear-gradient(150deg,rgba(212,232,255,.30),rgba(29,35,50,.77) 35%,rgba(15,17,28,.83));box-shadow:inset 0 2px 1px #ffffff72,inset 0 -1px 1px #ffffff27,0 16px 35px #0006;backdrop-filter:blur(35px) saturate(160%);-webkit-app-region:drag}.pill:before{content:"";position:absolute;inset:3px 70px auto;height:18px;border-radius:50%;background:linear-gradient(#ffffff40,transparent);pointer-events:none}.orb{width:40px;height:40px;flex:none;border-radius:50%;background:conic-gradient(from 50deg,#a29fff,#86eeef,#ffc0e6,#a29fff);box-shadow:0 0 20px #9bb7ff80;animation:turn 9s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}.text{min-width:0;flex:1;text-align:center}.line{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:800;font-size:22px;letter-spacing:.02em;background:linear-gradient(95deg,#fff,#b5e9ff,#f5b9ff,#fff);background-size:200% auto;color:transparent;background-clip:text;animation:shimmer 5s linear infinite;text-shadow:0 0 28px #91cfff6b}@keyframes shimmer{to{background-position:200% 0}}.next{margin-top:4px;color:#ffffff8c;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{display:grid;place-items:center;flex:none;width:26px;height:26px;border:0;border-radius:50%;background:#ffffff25;color:#fff;font-size:17px;cursor:pointer;-webkit-app-region:no-drag}.close:hover{background:#ffffff55}
.theme{display:grid;place-items:center;flex:none;width:26px;height:26px;border:0;border-radius:50%;background:#ffffff20;color:#fff;cursor:pointer;-webkit-app-region:no-drag}.theme:hover{background:#ffffff50}body[data-theme="amber"] .line{background-image:linear-gradient(95deg,#fff,#ffd27b,#ff9f76,#fff)}body[data-theme="mint"] .line{background-image:linear-gradient(95deg,#fff,#80ffd9,#96daff,#fff)}body[data-theme="rose"] .line{background-image:linear-gradient(95deg,#fff,#ff9bc3,#d2a2ff,#fff)}body[data-theme="white"] .line{background-image:linear-gradient(95deg,#fff,#ddd,#fff)}
</style></head><body><div class="pill"><div class="orb"></div><div class="text"><div class="line" id="line">Zenix 桌面歌词</div><div class="next" id="next">歌词会随着音乐在这里流动</div></div><button class="theme" id="theme" title="切换歌词颜色">◉</button><button class="close" id="close" title="关闭桌面歌词">×</button></div><script>const themes=['blue','amber','mint','rose','white'];let theme=localStorage.getItem('zenix.lyrics.theme')||'blue';document.body.dataset.theme=theme;document.getElementById('theme').onclick=()=>{theme=themes[(themes.indexOf(theme)+1)%themes.length];document.body.dataset.theme=theme;localStorage.setItem('zenix.lyrics.theme',theme)};window.desktopLyrics.onData(data=>{document.getElementById('line').textContent=data.line||data.title||'Zenix 桌面歌词';document.getElementById('next').textContent=data.next||data.title||''});document.getElementById('close').onclick=()=>window.desktopLyrics.hide();</script></body></html>
